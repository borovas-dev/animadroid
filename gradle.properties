org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP's incremental mode intermittently drops Hilt-generated classes (missing bindings, "Cannot create an instance of class ..."
# at runtime in release builds). Hilt needs whole-module processing, so keep incremental off.
ksp.incremental=false
